name: bump_version
description: Bump version number & create git tag

inputs:
  version_part:
    description: Version part to bump (major, minor, or patch)
    required: true
  gpg_key:
    description: GPG private key used for commit signing
    required: true
  gpg_passphrase:
    description: Passphrase for the gpg_key
    required: true

outputs:
  new_version:
    description: New version number after the bump
    value: ${{ steps.write_version.outputs.new_version }}
  git_tag:
    description: Name of the git tag associated with this version bump
    value: v${{ steps.write_version.outputs.new_version }}
  tag_url:
    description: Link to this git tag on Github
    value: https://github.com/benthevining/BenBot/releases/tag/v${{ steps.write_version.outputs.new_version }}

runs:
  using: "composite"
  steps:
  - name: Install Python dependencies
    shell: bash
    run: |
      python3 -m pip install --break-system-packages --upgrade bump-my-version pre-commit

  - name: Install NPM dependencies
    shell: bash
    run: npm install

  - name: Install pre-commit hooks
    shell: bash
    run: pre-commit install --install-hooks

  - name: Import GPG key
    uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd   # v7
    with:
      gpg_private_key: ${{ inputs.gpg_key }}
      passphrase: ${{ inputs.gpg_passphrase }}
      git_config_global: true
      git_user_signingkey: true
      git_commit_gpgsign: true
      git_tag_gpgsign: true

  - name: Configure commit identity
    shell: bash
    run: |
      git config user.name 'github-actions[bot]'
      git config user.email 'github-actions[bot]@users.noreply.github.com'

  - name: Write new version to output
    id: write_version
    shell: bash
    run: |
      new_version=$(bump-my-version show --increment ${{ inputs.version_part }} new_version)
      echo "new_version=$new_version" >> "$GITHUB_OUTPUT"

  - name: Bump version & create tag
    shell: bash
    run: bump-my-version bump --verbose ${{ inputs.version_part }}
