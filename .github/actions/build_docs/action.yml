name: build_docs
description: Build Doxygen documentation

runs:
  using: "composite"
  steps:
  - name: Install dependencies
    shell: bash
    run: |
      sudo apt-get update
      sudo apt-get install -y graphviz perl texlive-binaries

  - name: Install latest Doxygen
    uses: ssciwr/doxygen-install@329d88f5a303066a5bd006db7516b1925b86350e   # v2.0.1

  - name: Build docs
    uses: ./.github/actions/run_build
    id: run_build
    with:
      extra_config_args: -D BENBOT_TESTS=OFF -D CMAKE_REQUIRE_FIND_PACKAGE_Doxygen=TRUE
      build_target: ben_bot_docs

    # Parse Doxygen warnings to create JSON data for check status
  - name: Produce summary for check
    if: always()
    id: parse_doxygen_warnings
    env:
      SCRIPT: ${{ github.action_path }}/ReportDoxygenWarnings.py
      DOXYGEN_LOG: ${{ github.workspace }}/logs/Doxygen.log
    shell: bash
    run: |
      summary="$(python3 ${{ env.SCRIPT }}  --summary --doxygen-log=${{ env.DOXYGEN_LOG }})"
      echo "summary=$summary" >> "$GITHUB_OUTPUT"
      annotations="$(python3 ${{ env.SCRIPT }} --doxygen-log=${{ env.DOXYGEN_LOG }} --repo-root ${{ github.workspace }})"
      echo "annotations=$annotations" >> "$GITHUB_OUTPUT"

    # Create status check to report warnings
  - name: Report check state
    if: always()
    uses: LouisBrunner/checks-action@937cbbcde3259005b50746dc91cde29098aac2ff   # v3.1.0
    with:
      token: ${{ github.token }}
      name: Docs warnings
      conclusion: ${{ job.status }}   # expands to failure if any step has failed, success otherwise
      output: ${{ steps.parse_doxygen_warnings.outputs.summary }}
      annotations: ${{ steps.parse_doxygen_warnings.outputs.annotations }}

  - name: Upload artifact
    uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b   # v4
    with:
      name: BenBot-docs
      path: ${{ steps.run_build.outputs.deploy_dir }}/share/doc/html
