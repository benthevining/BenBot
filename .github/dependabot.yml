version: 2

# all dependencies are coalesced into this single group
# so that we get at most a single Dependabot PR per week
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)

updates:

- package-ecosystem: github-actions
  directory: /
  patterns: ["*"]
  multi-ecosystem-group: dependencies

- package-ecosystem: npm
  directory: /
  patterns: ["*"]
  multi-ecosystem-group: dependencies

- package-ecosystem: vcpkg
  directory: /
  patterns: ["*"]
  multi-ecosystem-group: dependencies

- package-ecosystem: pre-commit
  directory: /
  patterns: ["*"]
  multi-ecosystem-group: dependencies
  ignore:
  # its re-release tags (e.g. v0.11.0.1-1) look like prereleases to Dependabot, so it
  # "updates" them to the older tag. pre-commit.ci's autoupdate keeps this one current
  - dependency-name: https://github.com/shellcheck-py/shellcheck-py

- package-ecosystem: pip
  directories: [config, tests/position-solver, .github/actions/bump_version]
  patterns: ["*"]
  multi-ecosystem-group: dependencies

- package-ecosystem: docker
  directory: /config/lichess
  patterns: ["*"]
  multi-ecosystem-group: dependencies
