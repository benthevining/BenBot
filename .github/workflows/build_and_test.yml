name: Build & test (internal)

on:
  workflow_call:
    inputs:
      dashboard_type:
        description: Type of CTest dashboard to run (Nightly, Experimental, or Continuous)
        type: string # for some reason, workflow_call doesn't support choice inputs
        required: true

run-name: Build & test (${{ inputs.dashboard_type }})

defaults:
  run:
    shell: bash

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:

  build_and_test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
        config: [Debug, Release]
        preset: [clang]
        include:
        - os: windows-latest
          preset: msvc
          config: Debug
        - os: windows-latest
          preset: msvc
          config: Release
        - os: ubuntu-latest
          preset: gcc
          config: Debug
        - os: ubuntu-latest
          preset: gcc
          config: Release
        - os: ubuntu-latest
          preset: clang-asan
          config: Debug
        - os: ubuntu-latest
          preset: clang-ubsan
          config: Debug
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}.${{ matrix.preset }}.${{ matrix.config }}.${{ inputs.dashboard_type }}
    timeout-minutes: 120
    env:
      CMAKE_OSX_ARCHITECTURES: arm64;x86_64
      CMAKE_BUILD_PARALLEL_LEVEL: 8
      CTEST_PARALLEL_LEVEL: '' # empty value to make ctest detect the number of cores
      CTEST_NO_TESTS_ACTION: error
      CTEST_OUTPUT_ON_FAILURE: 1
      # NB. Windows runners may error out if we make these absolute paths prefixed with
      # ${{ github.workspace }}, because that may contain Windows-style backslashes
      BUILD_DIR: Builds/${{ matrix.preset }}
      DEPLOY_DIR: deploy

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install Python dependencies
      run: cmake -P InstallPythonDeps.cmake
      working-directory: .github/scripts

    - name: Install Linux dependencies
      if: runner.os == Linux
      run: |
        sudo apt-get update
        sudo apt-get install -y libc++-dev libc++abi-dev

    - name: Configure CMake
      env:
        BUILD_NAME: ${{ github.head_ref || github.ref_name }}.${{ matrix.os }}.${{ matrix.preset }}.${{ matrix.config }}
      run: cmake --preset ${{ matrix.preset }} -D BENBOT_DOCS=OFF -D STATIC_ANALYSIS=ON -D BUILDNAME=${{ env.BUILD_NAME }}

    - name: Build
      run: cmake --build . --config ${{ matrix.config }}
      working-directory: ${{ env.BUILD_DIR }}

#    - name: Build and test
#      run: ctest -D ${{ inputs.dashboard_type }} -C ${{ matrix.config }} --output-junit junit.xml --schedule-random
#      working-directory: ${{ env.BUILD_DIR }}

    - name: Upload JUnit report
      uses: mikepenz/action-junit-report@v5
      if: always() && github.event_name == 'pull_request' # only works when run from a PR
      with:
        report_paths: ${{ env.BUILD_DIR }}/junit.xml
        exclude_sources: ${{ env.BUILD_DIR }}
        check_annotations: true
        detailed_summary: true
        flaky_summary: true
        include_time_in_summary: true
        simplified_summary: true
        comment: true
        skip_comment_without_tests: true
        updateComment: false

    - name: Run cmake install
      if: always() && matrix.config == 'Release'
      run: cmake --install ${{ env.BUILD_DIR }} --prefix ${{ env.DEPLOY_DIR }} --component ben_bot --config ${{ matrix.config }}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      if: always() && matrix.config == 'Release'
      with:
        name: BenBot-${{ matrix.os }}-${{ matrix.preset }}
        path: deploy # using the full path here errors on Windows due to mixed forward/backslash usage in the path
        if-no-files-found: error
