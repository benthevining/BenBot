name: Build & test (internal)

on:
  workflow_call:
    inputs:
      dashboard_type:
        description: Type of CTest dashboard to run (Nightly, Experimental, or Continuous)
        type: string # for some reason, workflow_call doesn't support choice inputs
        required: true

run-name: Build & test (${{ inputs.dashboard_type }})

defaults:
  run:
    shell: bash

jobs:

  build_and_test:
    strategy:
      fail-fast: false
      matrix:
        # - GCC is Linux only
        # - MSVC is Windows only, no sanitizers
        # - Clang sanitizers don't seem to work on Windows
        # - Clang sanitizer builds are failing on Linux (probably due to Clang install method)
        os: [ubuntu-latest, windows-2025-vs2026, macos-15]
        config: [Debug, Release, ASAN, UBSAN]
        preset: [clang]
        exclude:
        - os: windows-2025-vs2026
          config: ASAN
        - os: windows-2025-vs2026
          config: UBSAN
        - os: ubuntu-latest
          config: ASAN
        - os: ubuntu-latest
          config: UBSAN
        include:
        - os: windows-2025-vs2026
          preset: msvc
          config: Debug
        - os: windows-2025-vs2026
          preset: msvc
          config: Release
        - os: ubuntu-latest
          preset: gcc
          config: Debug
        - os: ubuntu-latest
          preset: gcc
          config: Release
        - os: ubuntu-latest
          preset: gcc
          config: ASAN
        - os: ubuntu-latest
          preset: gcc
          config: UBSAN
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}.${{ matrix.preset }}.${{ matrix.config }}.${{ inputs.dashboard_type }}
    permissions:
      contents: read
    timeout-minutes: 180 # 3 hours
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

    - name: Build and test
      uses: ./.github/actions/build_and_test
      with:
        cmake_preset: ${{ matrix.preset }}
        build_config: ${{ matrix.config }}
        dashboard_type: ${{ inputs.dashboard_type }}

  # fails if bench isn't the same on every platform, which means that the search is different
  # somewhere (e.g. #681). The SPRT tests only run on Linux, so they wouldn't catch this
  check_bench:
    runs-on: ubuntu-latest
    name: Check bench is the same on every platform
    timeout-minutes: 10
    needs: build_and_test
    permissions:
      contents: read

    steps:
    - name: Download bench results
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        path: bench
        pattern: bench-*
        merge-multiple: true

    - name: Compare bench results
      run: |
        {
          echo "| OS | preset | bench |"
          echo "|---|---|---|"
          awk '{ print "| " $1 " | " $2 " | " $3 " |" }' bench/*.txt
        } >> "$GITHUB_STEP_SUMMARY"
        cat bench/*.txt
        if [[ "$(awk '{ print $3 }' bench/*.txt | sort -u | wc -l)" -ne 1 ]]; then
          echo "::error::Bench is different on different platforms"
          exit 1
        fi

  report_aggregate_test_results:
    runs-on: ubuntu-latest
    name: Report aggregate test results
    timeout-minutes: 10
    needs: build_and_test
    permissions:
      checks: write
      pull-requests: write

    steps:
    - name: Download JUnit results
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        path: junit
        pattern: junit-*
        merge-multiple: true

    - name: Report aggregate results
      uses: EnricoMi/publish-unit-test-result-action@da5b7be67623cd59bbbd1a0ce4f022050a55605f # v2.26.0
      with:
        check_name: "Test Results (${{ github.event.workflow_run.event || github.event_name }})"
        files: junit/*.xml
        comment_mode: changes in failures
        large_files: true
        report_individual_runs: true
