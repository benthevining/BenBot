name: Build & test (internal)

on:
  workflow_call:
    inputs:
      dashboard_type:
        description: Type of CTest dashboard to run (Nightly, Experimental, or Continuous)
        type: string # for some reason, workflow_call doesn't support choice inputs
        required: true

run-name: Build & test (${{ inputs.dashboard_type }})

defaults:
  run:
    shell: bash

jobs:

  build_and_test:
    strategy:
      fail-fast: false
      matrix:
        # - GCC is Linux only
        # - MSVC is Windows only, no sanitizers
        # - Clang sanitizers don't seem to work on Windows
        # - Clang sanitizer builds are failing on Linux (probably due to Clang install method)
        os: [ubuntu-latest, windows-2025-vs2026, macos-15]
        config: [Debug, Release, ASAN, UBSAN]
        preset: [clang]
        exclude:
        - os: windows-2025-vs2026
          config: ASAN
        - os: windows-2025-vs2026
          config: UBSAN
        - os: ubuntu-latest
          config: ASAN
        - os: ubuntu-latest
          config: UBSAN
        include:
        - os: windows-2025-vs2026
          preset: msvc
          config: Debug
        - os: windows-2025-vs2026
          preset: msvc
          config: Release
        - os: ubuntu-latest
          preset: gcc
          config: Debug
        # TODO: re-enable this configuration when bug is fixed! See https://github.com/benthevining/BenBot/issues/454
#        - os: ubuntu-latest
#          preset: gcc
#          config: Release
        - os: ubuntu-latest
          preset: gcc
          config: ASAN
        - os: ubuntu-latest
          preset: gcc
          config: UBSAN
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}.${{ matrix.preset }}.${{ matrix.config }}.${{ inputs.dashboard_type }}
    permissions:
      contents: read
    timeout-minutes: 180 # 3 hours
    steps:
    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10   # v6

    - name: Build and test
      uses: ./.github/actions/build_and_test
      with:
        cmake_preset: ${{ matrix.preset }}
        build_config: ${{ matrix.config }}
        dashboard_type: ${{ inputs.dashboard_type }}

  report_aggregate_test_results:
    runs-on: ubuntu-latest
    name: Report aggregate test results
    timeout-minutes: 10
    needs: build_and_test
    permissions:
      checks: write
      pull-requests: write

    steps:
    - name: Download JUnit results
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        path: junit
        pattern: junit-*
        merge-multiple: true

    - name: Report aggregate results
      uses: EnricoMi/publish-unit-test-result-action@c950f6fb443cb5af20a377fd0dfaa78838901040 # v2.23.0
      with:
        check_name: "Test Results (${{ github.event.workflow_run.event || github.event_name }})"
        files: junit/*.xml
        comment_mode: changes in failures
        large_files: true
        report_individual_runs: true
