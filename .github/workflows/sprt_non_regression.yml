name: SPRT non-regression

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}.${{ github.ref }}
  cancel-in-progress: true

jobs:

  sprt:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    uses: ./.github/workflows/sprt_internal.yml
    with:
      sprt_target: sprt_non_regression
      use_main: false
