name: Bump version, create tag & release

on:
  workflow_dispatch:
    inputs:
      version_part:
        description: "Version part to bump"
        required: true
        type: choice
        options:
        - 'major'
        - 'minor'
        - 'patch'

run-name: Bump version (${{ inputs.version_part }})

defaults:
  run:
    shell: bash

permissions:
  contents: write

jobs:

  bump_version:
    runs-on: ubuntu-latest
    name: Bump version & create tag
    timeout-minutes: 10
    environment:
      name: bump-project-version
      url: https://github.com/benthevining/BenBot/releases/tag/v${{ steps.write_version.outputs.new_version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Install Python dependencies
      run: python3 -m pip install --break-system-packages --upgrade bump-my-version pre-commit

    - name: Install NPM dependencies
      run: npm install

    - name: Install pre-commit hooks
      run: pre-commit install --install-hooks

    - name: Import GPG key
      uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # pin v6
      with:
        gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
        passphrase: ${{ secrets.GPG_PASSPHRASE }}
        git_config_global: true
        git_user_signingkey: true
        git_commit_gpgsign: true
        git_tag_gpgsign: true

    - name: Configure commit identity
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'

    - name: Write new version to output
      id: write_version
      run: |
        new_version=$(bump-my-version show --increment ${{ inputs.version_part }} new_version)
        echo "new_version=$new_version" >> "$GITHUB_OUTPUT"

    - name: Bump version & create tag
      run: bump-my-version bump --verbose ${{ inputs.version_part }}

    outputs:
      tag_name: v${{ steps.write_version.outputs.new_version }}

  build:
    needs: bump_version
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
        preset: [clang]
        include:
        - os: windows-latest
          preset: msvc
        - os: ubuntu-latest
          preset: gcc
    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.os }}.${{ matrix.preset }})
    timeout-minutes: 10
    env:
      CMAKE_OSX_ARCHITECTURES: arm64;x86_64
      CMAKE_BUILD_PARALLEL_LEVEL: 8
      BUILD_DIR: Builds/${{ matrix.preset }}
      DEPLOY_DIR: deploy

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        ref: ${{ needs.bump_version.outputs.tag_name }}

    - name: Configure CMake
      run: cmake --preset ${{ matrix.preset }} -D BENBOT_DOCS=OFF -D BENBOT_TESTS=OFF

    - name: Build
      run: cmake --build . --config Release --target ben_bot
      working-directory: ${{ env.BUILD_DIR }}

    - name: Run cmake install
      run: cmake --install ${{ env.BUILD_DIR }} --prefix ${{ env.DEPLOY_DIR }} --component ben_bot --config Release

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: BenBot-${{ matrix.os }}-${{ matrix.preset }}
        path: ${{ env.DEPLOY_DIR }}
        if-no-files-found: error

  build_docs:
    needs: bump_version
    permissions:
      pages: write
      id-token: write
      contents: read
    uses: ./.github/workflows/docs.yml
    with:
      ref: ${{ needs.bump_version.outputs.tag_name }}

  create_release:
    needs: [bump_version, build, build_docs]
    runs-on: ubuntu-latest
    name: Create GitHub release
    timeout-minutes: 10
    env:
      RELEASE_NOTES_FILE: release-notes.md

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        ref: ${{ needs.bump_version.outputs.tag_name }}

    - name: Write release notes
      run: python3 .github/scripts/WriteReleaseNotes.py CHANGELOG.md ${{ env.RELEASE_NOTES_FILE }}

    - name: Download artifacts
      id: download
      uses: actions/download-artifact@v5
      with:
        path: artifacts

    - name: ls
      run: ls
      working-directory: ${{ steps.download.outputs.download-path }}

    - name: Re-zip artifacts
      run: python3 ReZipArtifacts.py ${{ steps.download.outputs.download-path }}
      working-directory: .github/scripts

    - name: ls
      run: ls
      working-directory: ${{ steps.download.outputs.download-path }}

    - name: Create release
      uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # pin v2
      with:
        tag_name: ${{ needs.bump_version.outputs.tag_name }}
        files: ${{ steps.download.outputs.download-path }}/**
        fail_on_unmatched_files: true
        generate_release_notes: true
        body_path: ${{ env.RELEASE_NOTES_FILE }}
        make_latest: true

  build_docker:
    needs: bump_version
    runs-on: ubuntu-latest
    name: Update lichess-bot Docker image
    timeout-minutes: 20
    environment:
      name: lichess-bot-image
      url: ${{ steps.print_url.outputs.url }}
    env:
      LOCAL_TAG: benbot:${{ needs.bump_version.outputs.tag_name }}
      REMOTE_TAG: benvining/benbot-lichess:${{ needs.bump_version.outputs.tag_name }}

    steps:
    - name: Login to Docker
      uses: docker/login-action@v3
      with:
        username: benvining
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Checkout code
      uses: actions/checkout@v5
      with:
        ref: ${{ needs.bump_version.outputs.tag_name }}

    - name: Configure config file
      run: python3 SetupLichessConfig.py ${{ github.workspace }}/lichess/config.yml ${{ secrets.LICHESS_TOKEN }} ${{ needs.bump_version.outputs.tag_name }}
      working-directory: .github/scripts

    - name: Run Docker build
      run: docker build --file lichess/Dockerfile --tag ${{ env.LOCAL_TAG }} .

    - name: Tag image
      run: docker tag ${{ env.LOCAL_TAG }} ${{ env.REMOTE_TAG }}

    - name: Push to Docker hub
      run: docker push ${{ env.REMOTE_TAG }}

    - name: Print Docker tag URL
      id: print_url
      run: python3 PrintDockerTagURL.py ${{ needs.bump_version.outputs.tag_name }} >> $GITHUB_OUTPUT
      working-directory: .github/scripts

  deploy_vps:
    needs: [bump_version, build_docker]
    runs-on: ubuntu-latest
    name: Deploy Docker image to VPS
    timeout-minutes: 20
    environment:
      name: vps
      url: https://cloud.digitalocean.com/droplets/517152619
    env:
      REMOTE_TAG: benvining/benbot-lichess:${{ needs.bump_version.outputs.tag_name }}

    steps:
    - name: Update & restart Docker image
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VPS_IP_V4 }}
        username: root
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        script: |
          docker stop benbot
          docker rm benbot
          docker pull ${{ env.REMOTE_TAG }}
          docker run -d --name benbot ${{ env.REMOTE_TAG }}
