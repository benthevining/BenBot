name: Bump version, create tag & release

on:
  workflow_dispatch:
    inputs:
      version_part:
        description: "Version part to bump"
        required: true
        type: choice
        options:
        - 'major'
        - 'minor'
        - 'patch'

run-name: Bump version (${{ inputs.version_part }})

concurrency:
  group: ${{ github.workflow }}

defaults:
  run:
    shell: bash

jobs:

  # updates the version in all repo files, creates a git tag & pushes to Github
  # this step also outputs the tag name
  # note that the default for actions/checkout is to use the ref that triggered the action,
  # meaning that in order to use the version created by this step, subsequent steps need to
  # depend on this step in their needs: field and specify:
  #   with:
  #     ref: ${{ needs.bump_version.outputs.tag_name }}
  bump_version:
    runs-on: ubuntu-latest
    name: Bump version & create tag
    timeout-minutes: 10
    environment:
      name: bump-project-version
      url: https://github.com/benthevining/BenBot/releases/tag/v${{ steps.write_version.outputs.new_version }}
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Install Python dependencies
      run: python3 -m pip install --break-system-packages --upgrade bump-my-version pre-commit

    - name: Install NPM dependencies
      run: npm install

    - name: Install pre-commit hooks
      run: pre-commit install --install-hooks

    - name: Import GPG key
      uses: crazy-max/ghaction-import-gpg@v7
      with:
        gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
        passphrase: ${{ secrets.GPG_PASSPHRASE }}
        git_config_global: true
        git_user_signingkey: true
        git_commit_gpgsign: true
        git_tag_gpgsign: true

    - name: Configure commit identity
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'

    - name: Write new version to output
      id: write_version
      run: |
        new_version=$(bump-my-version show --increment ${{ inputs.version_part }} new_version)
        echo "new_version=$new_version" >> "$GITHUB_OUTPUT"

    - name: Bump version & create tag
      run: bump-my-version bump --verbose ${{ inputs.version_part }}

    outputs:
      tag_name: v${{ steps.write_version.outputs.new_version }}

  # builds & uploads just release binaries on all supported platforms
  build:
    needs: bump_version
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
        preset: [clang]
        include:
        - os: windows-latest
          preset: msvc
        - os: ubuntu-latest
          preset: gcc
    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.os }}.${{ matrix.preset }})
    timeout-minutes: 10
    environment:
      name: codesigning
      url: https://github.com/benthevining/BenBot/releases/tag/${{ needs.bump_version.outputs.tag_name }}
    env:
      CMAKE_OSX_ARCHITECTURES: arm64;x86_64
      CMAKE_BUILD_PARALLEL_LEVEL: 8
      # NB. Windows runners may error out if we make these absolute paths prefixed with
      # ${{ github.workspace }}, because that may contain Windows-style backslashes
      BUILD_DIR: Builds/${{ matrix.preset }}
      DEPLOY_DIR: deploy

    steps:
    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libc++-dev libc++abi-dev

    - name: Ensure CMake 4.0
      uses: lukka/get-cmake@v4.2.3

    - name: Import signing certificate to keychain
      if: runner.os == 'macOS'
      uses: Apple-Actions/import-codesign-certs@v6.0.0
      with:
        p12-file-base64: ${{ secrets.CODESIGN_CERT_FILE_BASE64 }}
        p12-password: ${{ secrets.CODESIGN_CERT_PASSWORD }}

    - name: Checkout code
      uses: actions/checkout@v6
      with:
        ref: ${{ needs.bump_version.outputs.tag_name }}

    - name: Configure CMake
      run: |
        cmake --preset ${{ matrix.preset }} -D "BENBOT_CODESIGN_ID=${{ secrets.BENBOT_CODESIGN_ID }}" -D BENBOT_DOCS=OFF -D BENBOT_TESTS=OFF

    - name: Build
      run: cmake --build . --config Release --target ben_bot
      working-directory: ${{ env.BUILD_DIR }}

    - name: Run cmake install
      run: |
        cmake --install ${{ env.BUILD_DIR }} --prefix ${{ env.DEPLOY_DIR }} --component ben_bot --config Release

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: BenBot-${{ matrix.os }}-${{ matrix.preset }}
        path: ${{ env.DEPLOY_DIR }}
        if-no-files-found: error

  # build & deploy docs from new tag
  build_docs:
    needs: bump_version
    permissions:
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      ref: ${{ needs.bump_version.outputs.tag_name }}

  # creates a Github release with the build & docs artifacts
  # the release notes are populated from the changelog file (which was generated by the bump-my-version command)
  create_release:
    needs: [bump_version, build, build_docs]
    runs-on: ubuntu-latest
    name: Create GitHub release
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_NOTES_FILE: ${{ github.workspace }}/release-notes.md
      REZIPPED_ARTIFACTS: ${{ github.workspace }}/rezipped

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        ref: ${{ needs.bump_version.outputs.tag_name }}

    - name: Write release notes
      run: python3 WriteReleaseNotes.py ${{ github.workspace }}/CHANGELOG.md ${{ env.RELEASE_NOTES_FILE }}
      working-directory: .github/scripts

    - name: Download artifacts
      id: download
      uses: actions/download-artifact@v8
      with:
        path: artifacts

    - name: Re-zip artifacts
      run: python3 ReZipArtifacts.py ${{ steps.download.outputs.download-path }} ${{ env.REZIPPED_ARTIFACTS }}
      working-directory: .github/scripts

    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.bump_version.outputs.tag_name }}
        files: ${{ env.REZIPPED_ARTIFACTS }}/**
        fail_on_unmatched_files: true
        generate_release_notes: true # autogenerate the link to the version range diff
        body_path: ${{ env.RELEASE_NOTES_FILE }} # body will the appended to autogenerated content
        make_latest: true

  # builds the lichess-bot Docker image from the latest git tag & uploads it to Dockerhub
  build_docker:
    needs: bump_version
    runs-on: ubuntu-latest
    name: Update lichess-bot Docker image
    timeout-minutes: 20
    environment:
      name: lichess-bot-image
      url: ${{ steps.print_url.outputs.url }}
    env:
      LOCAL_TAG: benbot:${{ needs.bump_version.outputs.tag_name }}
      REMOTE_TAG: benvining/benbot-lichess:${{ needs.bump_version.outputs.tag_name }}
      LICHESS_CONFIG_DIR: ${{ github.workspace }}/config/lichess

    steps:
    - name: Login to Docker
      uses: docker/login-action@v3
      with:
        username: benvining
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Checkout code
      uses: actions/checkout@v6
      with:
        ref: ${{ needs.bump_version.outputs.tag_name }}

    - name: Configure config file
      run: python3 SetupLichessConfig.py ${{ env.LICHESS_CONFIG_DIR }}/config.yml ${{ secrets.LICHESS_TOKEN }}
      working-directory: .github/scripts

    - name: Run Docker build
      run: docker build --file ${{ env.LICHESS_CONFIG_DIR }}/Dockerfile --tag ${{ env.LOCAL_TAG }} .

    - name: Tag image
      run: docker tag ${{ env.LOCAL_TAG }} ${{ env.REMOTE_TAG }}

    - name: Push to Docker hub
      run: docker push ${{ env.REMOTE_TAG }}

    - name: Print Docker tag URL
      id: print_url
      run: python3 PrintDockerTagURL.py ${{ needs.bump_version.outputs.tag_name }} >> $GITHUB_OUTPUT
      working-directory: .github/scripts

  # stops the old Docker container, pulls the newly built image at the latest tag from Dockerhub,
  # and starts new container from this image
  deploy_vps:
    needs: [bump_version, build_docker]
    runs-on: ubuntu-latest
    name: Deploy Docker image to VPS
    timeout-minutes: 10
    environment:
      name: vps
      url: https://cloud.digitalocean.com/droplets/517152619
    env:
      REMOTE_TAG: benvining/benbot-lichess:${{ needs.bump_version.outputs.tag_name }}
      IMAGE_NAME: benbot

    steps:
    - name: Update & restart Docker image
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VPS_IP_V4 }}
        username: root
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        script: |
          docker stop ${{ env.IMAGE_NAME }}
          docker rm ${{ env.IMAGE_NAME }}
          docker pull ${{ env.REMOTE_TAG }}
          docker run -d --name ${{ env.IMAGE_NAME }} ${{ env.REMOTE_TAG }}
          docker image prune -a -f
