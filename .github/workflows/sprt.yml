name: SPRT

on:
  workflow_dispatch:
    inputs:
      sprt_target:
        description: Name of the CMake target to build to execute the SPRT test
        type: choice
        options:
        - sprt_gain
        - sprt_non_regression
        required: true
      use_main:
        description: If true, runs SPRT against the latest main; if false, runs against the latest release
        type: boolean
        required: true

run-name: SPRT (${{ inputs.sprt_target }} - ${{ inputs.use_main }})

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:

  sprt:
    runs-on: ubuntu-latest
    name: Run SPRT test
    timeout-minutes: 300 # 5 hours

    steps:
    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

    - name: Run SPRT
      uses: ./.github/actions/run_sprt
      with:
        use_main: ${{ inputs.use_main }}
        target_name: ${{ inputs.sprt_target }}
