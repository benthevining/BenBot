name: SPRT

on:
  workflow_dispatch:
    inputs:
      sprt_target:
        description: Name of the CMake target to build to execute the SPRT test
        type: choice
        options:
        - sprt_gain
        - sprt_non_regression
        required: true
      use_main:
        description: If true, runs SPRT against the latest main; if false, runs against the latest release
        type: boolean
        required: true

run-name: SPRT (${{ inputs.sprt_target }} - ${{ inputs.use_main }})

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:

  sprt:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    name: Run SPRT test
    timeout-minutes: 300 # 5 hours
    env:
      CMAKE_PRESET: gcc
      CMAKE_BUILD_PARALLEL_LEVEL: 8
      BUILD_DIR: ${{ github.workspace }}/Builds/gcc
      SPRT_OUTPUT_LOG: ${{ github.workspace }}/logs/sprt/output.log
      # these directories are used for building & installing the latest
      # main, in the case that we're using main as the SPRT baseline
      TMP_ROOT: ${{ github.workspace }}/tmp-main
      TMP_BUILD_DIR: ${{ github.workspace }}/tmp-main/Builds/gcc
      TMP_DEPLOY_DIR: ${{ github.workspace }}/tmp-main/deploy

    steps:
    - name: Install CMake 4.0
      uses: lukka/get-cmake@b78306120111dc2522750771cfd09ee7ca723687 # v4.3.0

    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

    - name: Download latest fastchess release
      id: download_fastchess
      uses: robinraju/release-downloader@daf26c55d821e836577a15f77d86ddc078948b05 # v1.12
      with:
        repository: Disservin/fastchess
        latest: true
        fileName: '*-linux-x86-64*'
        tarBall: false
        zipBall: false
        out-file-path: fastchess
        extract: true

    # parses download_fastchess output to print the fastchess executable path to a step output
    - name: Print fastchess filename
      id: fastchess_filename
      run: |
        tar_path=${{ fromJson(steps.download_fastchess.outputs.downloaded_files)[0] }}
        filename=$(basename "$tar_path" ".tar")
        dirpath=$(dirname "$tar_path")
        result="$dirpath/$filename/fastchess"
        echo "fastchess=$result" >> "$GITHUB_OUTPUT"

    - name: Add execution permissions
      run: chmod --preserve-root 777 ${{ steps.fastchess_filename.outputs.fastchess }}

    # --- if not building against main, download latest release ---

    - name: Download latest BenBot release
      if: ${{ !inputs.use_main }}
      id: download_benbot
      uses: robinraju/release-downloader@daf26c55d821e836577a15f77d86ddc078948b05 # v1.12
      with:
        latest: true
        fileName: BenBot-ubuntu-latest-clang.zip
        tarBall: false
        zipBall: false
        out-file-path: baseline
        extract: true

    # parses download_benbot output to print the ben_bot executable path to a step output
    - name: Print BenBot filename
      if: ${{ !inputs.use_main }}
      id: benbot_filename
      run: |
        zip_path=${{ fromJson(steps.download_benbot.outputs.downloaded_files)[0] }}
        filename=$(basename "$zip_path" ".zip")
        dirpath=$(dirname "$zip_path")
        result="$dirpath/$filename/bin/ben_bot"
        echo "benbot=$result" >> "$GITHUB_OUTPUT"

    - name: Add execution permissions
      if: ${{ !inputs.use_main }}
      run: chmod --preserve-root 777 ${{ steps.benbot_filename.outputs.benbot }}

      # --- if building against main, clone & build latest main ---

    - name: Checkout main
      if: ${{ inputs.use_main }}
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        ref: main
        path: ${{ env.TMP_ROOT }}

    - name: Configure main
      if: ${{ inputs.use_main }}
      run: cmake --preset ${{ env.CMAKE_PRESET }} -D BENBOT_DOCS=OFF
      working-directory: ${{ env.TMP_ROOT }}

    - name: Build main
      if: ${{ inputs.use_main }}
      run: cmake --build . --target ben_bot --config Release
      working-directory: ${{ env.TMP_BUILD_DIR }}

    - name: Install main
      if: ${{ inputs.use_main }}
      run: |
        cmake --install ${{ env.TMP_BUILD_DIR }} --prefix ${{ env.TMP_DEPLOY_DIR }} --component ben_bot --config Release

      # --- configure SPRT build ---

    - name: Configure CMake
      run: |
        cmake --preset ${{ env.CMAKE_PRESET }} -D BENBOT_DOCS=OFF -D FASTCHESS_PROGRAM=${{ steps.fastchess_filename.outputs.fastchess }}

    - name: Inject baseline binary
      if: ${{ !inputs.use_main }}
      run: cmake -D BASELINE_BINARY=${{ steps.benbot_filename.outputs.benbot }} -P InjectSPRTBaseline-Release.cmake
      working-directory: ${{ env.BUILD_DIR }}

    - name: Inject baseline binary
      if: ${{ inputs.use_main }}
      run: cmake -D BASELINE_BINARY=${{ env.TMP_DEPLOY_DIR }}/bin/ben_bot -P InjectSPRTBaseline-Release.cmake
      working-directory: ${{ env.BUILD_DIR }}

    - name: Build
      run: cmake --build . --target ben_bot --config Release
      working-directory: ${{ env.BUILD_DIR }}

    - name: Run SPRT test
      # NB. tee needs the output directory to exist before it's invoked
      run: |
        cmake -E make_directory $(dirname ${{ env.SPRT_OUTPUT_LOG }})
        cmake --build . --target ${{ inputs.sprt_target }} --config Release | tee ${{ env.SPRT_OUTPUT_LOG }}
      working-directory: ${{ env.BUILD_DIR }}

    - name: Upload logs
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
      with:
        name: sprt-logs
        path: logs/sprt
        if-no-files-found: error

    - name: Report results
      run: python3 ReportSPRTResults.py ${{ env.SPRT_OUTPUT_LOG }} >> $GITHUB_STEP_SUMMARY
      working-directory: .github/scripts
