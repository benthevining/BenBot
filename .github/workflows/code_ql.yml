name: CodeQL

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}.${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  security-events: write

jobs:

  analyze_scripts:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python]
    runs-on: ubuntu-latest
    name: Analyze (${{ matrix.language }})
    timeout-minutes: 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

    - name: Initialize CodeQL
      uses: github/codeql-action/init@38697555549f1db7851b81482ff19f1fa5c4fedc # v4
      with:
        languages: ${{ matrix.language }}
        build-mode: none
        queries: security-and-quality

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@38697555549f1db7851b81482ff19f1fa5c4fedc # v4
      with:
        category: "/language:${{matrix.language}}"

  analyze_cpp:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    name: Analyze C++
    timeout-minutes: 20
    env:
      LANGUAGE: c-cpp
      CMAKE_BUILD_PARALLEL_LEVEL: 8
      PRESET: gcc

    steps:
    - name: Install CMake 4.0
      uses: lukka/get-cmake@b78306120111dc2522750771cfd09ee7ca723687 # v4.3.0

    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

    - name: Initialize CodeQL
      uses: github/codeql-action/init@38697555549f1db7851b81482ff19f1fa5c4fedc # v4
      with:
        languages: ${{ env.LANGUAGE }}
        build-mode: manual
        queries: security-and-quality

    - name: Configure CMake
      run: cmake --preset ${{ env.PRESET }}

    - name: Build
      run: cmake --build . --config Debug
      working-directory: Builds/${{ env.PRESET }}

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@38697555549f1db7851b81482ff19f1fa5c4fedc # v4
      with:
        category: "/language:${{ env.LANGUAGE }}"
