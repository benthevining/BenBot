# Runs the pytest tests for the Python scripts used by the CI workflows (see tests/scripts/).

name: CI script tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
    - .github/actions/**.py
    - tests/fastchess/**.py
    - tests/scripts/**
    - .github/workflows/script_tests.yml
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
    - .github/actions/**.py
    - tests/fastchess/**.py
    - tests/scripts/**
    - .github/workflows/script_tests.yml

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}.${{ github.ref }}
  cancel-in-progress: true

jobs:

  pytest:
    runs-on: ubuntu-latest
    name: Test CI scripts
    timeout-minutes: 10
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

      # the runner's system Python doesn't allow installing packages outside a venv
    - name: Install pytest
      run: |
        python3 -m venv "$RUNNER_TEMP/venv"
        "$RUNNER_TEMP/venv/bin/pip" install -r tests/scripts/requirements.txt

    - name: Run tests
      run: |
        "$RUNNER_TEMP/venv/bin/python" -m pytest tests/scripts -v
