#
# ======================================================================================

# Runs bench on each push to a PR, and keeps a "Bench: <nodes>" line at the end of the PR's
# description up to date. The repo's default merge commit message is the PR's description, so
# merging from the web UI puts the bench in the merge commit.
# The PR's base is built & benched too, and the paragraph above the bench line says whether the
# bench changed. The PR is checked out at its merge commit with the base, so comparing against
# the base shows the PR's own changes. The base is built instead of reading the bench from its
# commit message because not every commit on main has one, and a merge commit's bench line is
# the PR's bench, which can be out of date if main changed before the PR was merged.

name: PR bench

on:
  pull_request:
    types: [opened, reopened, synchronize]

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}.${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:

  bench:
    # the token can't edit PRs from forks
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    name: Run bench
    timeout-minutes: 30
    outputs:
      nodes: ${{ steps.bench.outputs.nodes }}
      base_nodes: ${{ steps.bench.outputs.base_nodes }}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Build
      id: build
      uses: ./.github/actions/run_build

    - name: Checkout base
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: tmp-base
        persist-credentials: false

      # if the base doesn't build, the bench line is still updated, just without the comparison
    - name: Build base
      id: build_base
      continue-on-error: true
      uses: ./.github/actions/run_build
      with:
        root_dir: ${{ github.workspace }}/tmp-base

    - name: Run bench
      id: bench
      env:
        BEN_BOT: ${{ steps.build.outputs.deploy_dir }}/bin/ben_bot
        BASE_BEN_BOT: ${{ steps.build_base.outputs.deploy_dir }}/bin/ben_bot
      run: |
        bench() {
          (echo bench; echo quit) | "$1" | sed -n 's/^info string Total nodes: \([0-9][0-9]*\).*/\1/p'
        }
        nodes="$(bench "$BEN_BOT")"
        if [[ -z "$nodes" ]]; then
          echo "::error::Couldn't find the node count in the bench output"
          exit 1
        fi
        base_nodes=""
        if [[ -x "$BASE_BEN_BOT" ]]; then
          base_nodes="$(bench "$BASE_BEN_BOT" || true)"
        fi
        if [[ -z "$base_nodes" ]]; then
          echo "::warning::Couldn't get the base's bench, so the PR description won't say how the bench changed"
        fi
        echo "Bench: $nodes (base: ${base_nodes:-unknown})" >> "$GITHUB_STEP_SUMMARY"
        echo "nodes=$nodes" >> "$GITHUB_OUTPUT"
        echo "base_nodes=$base_nodes" >> "$GITHUB_OUTPUT"

  # the bench job builds & runs the PR's code, so it only gets read access, & this job (which can
  # write to the PR) only runs the default branch's scripts
  update_description:
    needs: bench
    runs-on: ubuntu-latest
    name: Update bench in PR description
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
    - name: Checkout scripts
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.repository.default_branch }}
        sparse-checkout: .github/actions
        persist-credentials: false

      # fetch the description now instead of using the event's, in case it's been edited since.
      # The node counts come from a job that ran the PR's code, so check they're numbers first
    - name: Update PR description
      env:
        GH_TOKEN: ${{ github.token }}
        NODES: ${{ needs.bench.outputs.nodes }}
        BASE_NODES: ${{ needs.bench.outputs.base_nodes }}
      run: |
        if ! [[ "$NODES" =~ ^[0-9]+$ && "$BASE_NODES" =~ ^[0-9]*$ ]]; then
          echo "::error::The bench job's node counts aren't numbers"
          exit 1
        fi
        gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.body // ""' > "$RUNNER_TEMP/body.md"
        python3 .github/actions/UpdateBenchLine.py "$RUNNER_TEMP/body.md" "$NODES" "$BASE_NODES"
        gh api --method PATCH "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" -F "body=@$RUNNER_TEMP/body.md" > /dev/null
