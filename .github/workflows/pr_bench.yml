#
# ======================================================================================

# Runs bench on each push to a PR, and keeps a "Bench: <nodes>" line at the end of the PR's
# description up to date. The repo's default merge commit message is the PR's description, so
# merging from the web UI puts the bench in the merge commit.

name: PR bench

on:
  pull_request:
    types: [opened, reopened, synchronize]

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}.${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:

  bench:
    # the token can't edit PRs from forks
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    name: Update bench in PR description
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false

    - name: Build
      id: build
      uses: ./.github/actions/run_build

    - name: Run bench
      id: bench
      env:
        BEN_BOT: ${{ steps.build.outputs.deploy_dir }}/bin/ben_bot
      run: |
        nodes="$( (echo bench; echo quit) | "$BEN_BOT" | sed -n 's/^info string Total nodes: \([0-9][0-9]*\).*/\1/p')"
        if [[ -z "$nodes" ]]; then
          echo "::error::Couldn't find the node count in the bench output"
          exit 1
        fi
        echo "Bench: $nodes" >> "$GITHUB_STEP_SUMMARY"
        echo "nodes=$nodes" >> "$GITHUB_OUTPUT"

      # fetch the description now instead of using the event's, in case it's been edited since
    - name: Update PR description
      env:
        GH_TOKEN: ${{ github.token }}
        NODES: ${{ steps.bench.outputs.nodes }}
      run: |
        gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.body // ""' > "$RUNNER_TEMP/body.md"
        python3 .github/actions/UpdateBenchLine.py "$RUNNER_TEMP/body.md" "$NODES"
        gh api --method PATCH "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" -F "body=@$RUNNER_TEMP/body.md" > /dev/null
